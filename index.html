<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tic Tac Toe</title>
    <link rel="stylesheet" href="styles.css">
    <script src="script.js" defer></script>
</head>
<body>
    <h1>Tic Tac Toe!</h1>
    <div id="board">
        <span id="boardHeader">Current player: X</span>
        <div id="boardTable">
            <div class="boardRow">
                <button class="boardCell"></button>
                <button class="boardCell"></button>
                <button class="boardCell"></button>
            </div>
            <div class="boardRow">
                <button class="boardCell"></button>
                <button class="boardCell"></button>
                <button class="boardCell"></button>
            </div>
            <div class="boardRow">
                <button class="boardCell"></button>
                <button class="boardCell"></button>
                <button class="boardCell"></button>
            </div>
        </div>
    </div>
</body>
</html>
